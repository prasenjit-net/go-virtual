name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        run: |
          # Find the latest semver tag (vMAJOR.MINOR.PATCH)
          LATEST=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Latest tag: $LATEST"

          # Strip leading 'v' and split
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build-ui:
    name: Build UI
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  test-go:
    name: Test Go Backend
    needs: [version, build-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet -tags unit ./...

      - name: Run tests
        run: go test -tags unit -v -race ./...

      - name: Enforce coverage threshold
        run: |
          go test -tags unit -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 80) { printf "Coverage %.2f%% is below 80%%\n", total; exit 1 } }'

  build-binaries:
    name: Build Binaries
    needs: [version, build-ui, test-go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${{ needs.version.outputs.tag }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags="-s -w \
            -X github.com/prasenjit/go-virtual/internal/version.Version=${VERSION} \
            -X github.com/prasenjit/go-virtual/internal/version.Commit=${COMMIT} \
            -X github.com/prasenjit/go-virtual/internal/version.BuildDate=${BUILD_DATE}" \
            -o go-virtual-${{ matrix.suffix }} ./cmd/server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-virtual-${{ matrix.suffix }}
          path: go-virtual-${{ matrix.suffix }}
          retention-days: 1

  release:
    name: Create Release
    needs: [version, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: go-virtual-*
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          NEW_TAG="${{ needs.version.outputs.tag }}"
          # Get the tag that existed before the new one
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${NEW_TAG}$" \
            | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - showing all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges | head -50)
          else
            echo "Generating changelog from $PREVIOUS_TAG to $NEW_TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges "${PREVIOUS_TAG}..${NEW_TAG}")
          fi

          echo "$COMMITS" > changelog.txt
          {
            echo 'commits<<EOF'
            cat changelog.txt
            echo EOF
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Go-Virtual ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-rc') || contains(needs.version.outputs.tag, '-beta') || contains(needs.version.outputs.tag, '-alpha') }}
          generate_release_notes: false
          body: |
            ## Go-Virtual ${{ needs.version.outputs.tag }}

            API proxy/mock service for OpenAPI 3 specifications with configurable responses, templating, and real-time tracing.

            ### 🚀 Features
            - **OpenAPI 3 Support**: Parse and virtualize any OpenAPI 3 specification
            - **Condition-Based Responses**: Match responses based on path, query, header, or body conditions
            - **Response Templating**: Dynamic responses using request data with template variables
            - **Priority-Based Matching**: Configure response priority for complex scenarios
            - **Example Fallback**: Use spec examples as fallback when no response matches
            - **Real-Time Tracing**: WebSocket-based live request/response tracing
            - **Statistics Dashboard**: Monitor performance and request metrics
            - **Embedded Admin UI**: Single binary with built-in React admin interface

            ### 📦 Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | amd64 | `go-virtual-linux-amd64` |
            | Linux | arm64 | `go-virtual-linux-arm64` |
            | macOS | amd64 (Intel) | `go-virtual-darwin-amd64` |
            | macOS | arm64 (Apple Silicon) | `go-virtual-darwin-arm64` |
            | Windows | amd64 | `go-virtual-windows-amd64.exe` |

            ### 🏃 Quick Start

            ```bash
            # Download and make executable (Linux/macOS)
            chmod +x go-virtual-*

            # Run the server
            ./go-virtual-linux-amd64 -port 8080

            # Access the admin UI
            open http://localhost:8080/_ui/
            ```

            ### 📝 What's Changed

            ${{ steps.changelog.outputs.commits }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.previous_tag || 'initial' }}...${{ needs.version.outputs.tag }}
          files: |
            artifacts/*

  docker:
    name: Build & Push Docker Image
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: prasenjitnet/go-virtual
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

