<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="go-virtual logo">
  <!--
    Concept: "OpenAPI Shadow Mock"
    • Main document  = the real OpenAPI spec (solid indigo outline + content lines)
    • Shadow document = the virtual / mock copy (dashed violet, offset)
    • Check badge    = test passing / mock validated (emerald green)
    Transparent background → works on both light and dark sidebars / README.
  -->

  <!-- Shadow document — the virtual / mock copy (offset right+down, dashed) -->
  <rect x="28" y="22" width="50" height="64" rx="10"
    fill="#818cf8" fill-opacity="0.10"
    stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3.5" stroke-opacity="0.65"/>

  <!-- Main document — the OpenAPI spec (solid, front layer) -->
  <rect x="12" y="8" width="52" height="66" rx="10"
    fill="#4f46e5" fill-opacity="0.07"
    stroke="#4f46e5" stroke-width="2.5"/>

  <!-- Header stripe: rounded-top only (represents spec title bar) -->
  <path d="M 12 22 L 12 18 Q 12 8 22 8 L 54 8 Q 64 8 64 18 L 64 22 Z"
    fill="#4f46e5" fill-opacity="0.18"/>

  <!-- OpenAPI spec content lines -->
  <!-- Title / operationId line (bold) -->
  <line x1="21" y1="34" x2="55" y2="34"
    stroke="#4338ca" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Schema / property lines -->
  <line x1="21" y1="43" x2="50" y2="43"
    stroke="#4f46e5" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <line x1="21" y1="51" x2="54" y2="51"
    stroke="#4f46e5" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <line x1="21" y1="59" x2="40" y2="59"
    stroke="#4f46e5" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Test / validation badge (bottom-right, overlapping corner) -->
  <circle cx="72" cy="78" r="14" fill="#059669"/>
  <circle cx="72" cy="78" r="14" fill="white" fill-opacity="0.10"/>
  <!-- Checkmark -->
  <polyline points="64.5,78 70.5,84.5 80.5,71"
    fill="none" stroke="white" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
