<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" role="img" aria-label="go-virtual — API Mock and Virtualization">
  <!--
    Banner for README / documentation (dark background version).
    Design mirrors logo.svg: OpenAPI document + shadow copy + validation badge.
  -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="b-bg" x1="0" y1="0" x2="520" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1828"/>
      <stop offset="100%" stop-color="#172038"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="110" rx="16" fill="url(#b-bg)"/>

  <!-- Icon: same concept as logo.svg, colours lightened for dark background -->
  <g transform="translate(8, 10) scale(0.9)">
    <!-- Shadow document — the virtual / mock copy (offset right+down, dashed) -->
    <rect x="28" y="22" width="50" height="64" rx="10"
      fill="#a5b4fc" fill-opacity="0.10"
      stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5,3.5" stroke-opacity="0.55"/>
    <!-- Main document — the OpenAPI spec (solid, front layer) -->
    <rect x="12" y="8" width="52" height="66" rx="10"
      fill="#818cf8" fill-opacity="0.12"
      stroke="#818cf8" stroke-width="2.5"/>
    <!-- Header stripe (spec title bar) -->
    <path d="M 12 22 L 12 18 Q 12 8 22 8 L 54 8 Q 64 8 64 18 L 64 22 Z"
      fill="#818cf8" fill-opacity="0.25"/>
    <!-- Content lines -->
    <line x1="21" y1="34" x2="55" y2="34"
      stroke="#c7d2fe" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="21" y1="43" x2="50" y2="43"
      stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="21" y1="51" x2="54" y2="51"
      stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <line x1="21" y1="59" x2="40" y2="59"
      stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <!-- Validation badge -->
    <circle cx="72" cy="78" r="14" fill="#10b981"/>
    <circle cx="72" cy="78" r="14" fill="white" fill-opacity="0.08"/>
    <polyline points="64.5,78 70.5,84.5 80.5,71"
      fill="none" stroke="white" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Vertical divider -->
  <line x1="107" y1="18" x2="107" y2="92" stroke="#1e3a5f" stroke-width="1" opacity="0.7"/>

  <!-- Wordmark: "go" indigo, "-" slate, "virtual" violet -->
  <text y="62" font-family="'SF Mono','Fira Code','Consolas','Courier New',monospace"
        font-size="36" font-weight="700" letter-spacing="-0.5">
    <tspan x="122" fill="#818cf8">go</tspan><tspan fill="#475569">-</tspan><tspan fill="#a5b4fc">virtual</tspan>
  </text>

  <!-- Subtitle -->
  <text x="124" y="83"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="13" fill="#475569" letter-spacing="2.2" font-weight="500">
    API MOCK &amp; VIRTUALIZATION
  </text>
</svg>
