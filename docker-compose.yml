# go-virtual — local development / quick-start
#
# Builds the image from source using Dockerfile.local (native platform,
# no buildx required) and runs a single instance using file-based storage
# and in-memory sessions. Spec data is persisted to ./data on the host.
#
# Usage:
#   docker-compose up --build        # build from source and start
#   docker-compose up -d --build     # detached
#   docker-compose down              # stop (./data is preserved)
#
# Or via Makefile:
#   make compose-up-build            # build and start
#   make compose-up                  # start with cached image
#   make compose-down                # stop
#   make compose-logs                # follow logs

services:

  go-virtual:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      # File storage — data is written to the mounted volume
      GOVIRTUAL_STORAGE_TYPE: file
      GOVIRTUAL_STORAGE_PATH: /home/nonroot/data

      # In-memory sessions (no Redis needed for local dev)
      GOVIRTUAL_SESSION_STORETYPE: memory

      # Human-readable logs for local dev
      GOVIRTUAL_LOGGING_LEVEL: info
      GOVIRTUAL_LOGGING_FORMAT: text
    volumes:
      # Persist spec/response data between restarts
      - ./data:/home/nonroot/data
    healthcheck:
      test: ["CMD", "/go-virtual", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

