# go-virtual — local MongoDB for development / testing
#
# Starts a single-node MongoDB replica set so change streams work.
# The replica set is required for go-virtual's sync watcher in mongo mode.
#
# Usage:
#   docker-compose up -d        # start MongoDB in background
#   docker-compose down         # stop (data volume is preserved)
#   docker-compose down -v      # stop and wipe data
#
# Connect from local source:
#   URI: mongodb://localhost:27017/?replicaSet=rs0
#
# Run go-virtual against it:
#   GOVIRTUAL_STORAGE_TYPE=mongo \
#   GOVIRTUAL_STORAGE_MONGO_URI="mongodb://localhost:27017/?replicaSet=rs0" \
#   go run ./cmd/server serve

services:

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: go-virtual
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
