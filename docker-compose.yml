# go-virtual — full example stack
#
# Services:
#   go-virtual    http://localhost:8080        mock server + admin UI at /_ui/
#   mongo         localhost:27017              MongoDB (single-node replica set)
#   mongo-express http://localhost:8081        MongoDB admin UI  (admin / pass)
#   redis         localhost:6379               Redis
#   redis-insight http://localhost:8082        Redis admin UI
#
# Usage:
#   docker compose up -d
#   docker compose down -v   # stop and remove volumes

services:

  # ── MongoDB (single-node replica set for change stream support) ───────────
  mongo:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot container that initialises the replica set on first boot.
  # It exits immediately once rs.initiate() succeeds (idempotent on subsequent runs).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0,host:'mongo:27017'}]}) }"
    restart: "no"

  # ── Mongo Express (MongoDB admin UI) ──────────────────────────────────────
  mongo-express:
    image: mongo-express:1
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
      ME_CONFIG_OPTIONS_EDITORTHEME: dracula
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── RedisInsight (Redis admin UI) ─────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8082:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── go-virtual ────────────────────────────────────────────────────────────
  go-virtual:
    image: prasenjitnet/go-virtual:latest
    ports:
      - "8080:8080"
    environment:
      # Storage — MongoDB with change stream sync
      GOVIRTUAL_STORAGE_TYPE: mongo
      GOVIRTUAL_STORAGE_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      GOVIRTUAL_STORAGE_MONGO_DATABASE: go-virtual
      GOVIRTUAL_STORAGE_MONGO_SYNC_MODE: auto

      # Sessions — shared across replicas via Redis
      GOVIRTUAL_SESSION_STORETYPE: redis
      GOVIRTUAL_SESSION_REDIS_ADDR: redis:6379

      # Logging
      GOVIRTUAL_LOGGING_LEVEL: info
      GOVIRTUAL_LOGGING_FORMAT: json
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  redis-insight-data:
