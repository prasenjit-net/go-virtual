server:
  port: 8080
  host: "0.0.0.0"
  tls:
    enabled: false          # Enable TLS support
    certFile: ""            # Path to certificate file (optional)
    keyFile: ""             # Path to private key file (optional)
    autoGenerate: true      # Auto-generate self-signed cert if not configured
    storePath: ""           # Path to store auto-generated certs (default: <storage.path>/certs)

storage:
  type: "file"       # "memory" or "file"
  path: "./data"     # Path for file storage

tracing:
  maxTraces: 1000    # Max traces to keep in memory
  retention: "24h"   # Trace retention period

logging:
  level: "info"

branding:
  appTitle: ""       # Custom app title shown in the sidebar and browser tab (default: "go-virtual")
  appSubtitle: ""    # Optional tagline shown in the sidebar footer (default: "API Mock & Virtualization")
  format: "json"

scripting:
  defaultTimeoutMs: 100  # Default Starlark execution timeout per script in milliseconds

session:
  headerName: "X-Virtual-Session-Id"  # Header used to identify sessions
  inactivityTimeout: "30m"            # Idle TTL before session is discarded (Go duration string)
  maxSessions: 10000                  # Hard cap on concurrent sessions

proxy:
  timeoutSeconds: 30          # Timeout (in seconds) for outbound backend requests in proxy mode
  insecureSkipVerify: false   # Skip TLS server verification (for self-signed certs in dev; never use in prod)
  mtls:
    certFile: ""    # Path to PEM-encoded client certificate  (required for mTLS)
    keyFile: ""     # Path to PEM-encoded client private key  (required for mTLS)
    caCertFile: ""  # Path to PEM-encoded CA cert to verify the backend server (optional; uses system pool if empty)
