openapi: 3.0.3
info:
  title: Pet Store API
  description: A sample Pet Store API for testing Go-Virtual proxy service
  version: 1.0.0
  contact:
    name: API Support
    email: support@petstore.example.com

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: pets
    description: Pet operations
  - name: store
    description: Store operations
  - name: users
    description: User operations

paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            format: int32
            default: 10
            maximum: 100
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              example:
                - id: "pet-1"
                  name: "Fluffy"
                  category: "cat"
                  status: "available"
                  tags: ["cute", "furry"]
                - id: "pet-2"
                  name: "Rex"
                  category: "dog"
                  status: "pending"
                  tags: ["friendly"]
        '400':
          description: Bad request — invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Invalid query parameter"
                details: "Parameter 'limit' must be a positive integer no greater than 100"
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "A valid Authorization header is required"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "An unexpected error occurred while fetching pets"

    post:
      tags:
        - pets
      summary: Create a new pet
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: "pet-999"
                name: "Fluffy"
                category: "cat"
                status: "available"
                tags: ["new"]
                createdAt: "2026-04-05T10:00:00Z"
        '400':
          description: Invalid input — missing required fields or bad values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Validation error"
                details: "Field 'name' is required"
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "A valid Authorization header is required to create a pet"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Failed to persist the new pet record"

  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Get a pet by ID
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: The ID of the pet to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: "pet-123"
                name: "Fluffy"
                category: "cat"
                status: "available"
                tags: ["cute", "furry"]
                createdAt: "2026-01-15T08:30:00Z"
        '400':
          description: Bad request — petId format invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Invalid pet ID"
                details: "Pet ID must be a non-empty alphanumeric string"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "Please provide a valid Authorization header"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Pet not found"
                details: "No pet exists with ID 'pet-123'"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Database query failed while retrieving pet"

    put:
      tags:
        - pets
      summary: Update a pet
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: "pet-123"
                name: "Fluffy Updated"
                category: "cat"
                status: "sold"
                tags: ["cute", "furry", "updated"]
                createdAt: "2026-01-15T08:30:00Z"
        '400':
          description: Bad request — invalid update payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Validation error"
                details: "Field 'status' must be one of: available, pending, sold"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "Please provide a valid Authorization header"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Pet not found"
                details: "No pet exists with ID 'pet-123'"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Failed to update pet record in database"

    delete:
      tags:
        - pets
      summary: Delete a pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pet deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "Please provide a valid Authorization header"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Pet not found"
                details: "No pet exists with ID 'pet-123'"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Failed to delete pet record from database"

  /store/orders:
    get:
      tags:
        - store
      summary: List all orders
      operationId: listOrders
      parameters:
        - name: X-Customer-Id
          in: header
          description: Customer ID for filtering orders
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: "order-1"
                  petId: "pet-123"
                  quantity: 2
                  status: "placed"
                  shipDate: "2026-04-10T00:00:00Z"
                  complete: false
                - id: "order-2"
                  petId: "pet-456"
                  quantity: 1
                  status: "delivered"
                  shipDate: "2026-04-01T00:00:00Z"
                  complete: true
        '401':
          description: Unauthorized — missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "A valid X-Customer-Id header or Authorization token is required"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Failed to retrieve orders from database"

    post:
      tags:
        - store
      summary: Place an order
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: "order-789"
                petId: "pet-123"
                quantity: 1
                status: "placed"
                shipDate: "2026-04-12T00:00:00Z"
                complete: false
        '400':
          description: Invalid order — missing required fields or unknown petId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Validation error"
                details: "Field 'petId' is required and must reference an existing pet"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "Please provide a valid Authorization header to place orders"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Order could not be persisted due to a database error"

  /store/orders/{orderId}:
    get:
      tags:
        - store
      summary: Get order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: "order-456"
                petId: "pet-123"
                quantity: 1
                status: "approved"
                shipDate: "2026-04-08T00:00:00Z"
                complete: false
        '400':
          description: Bad request — orderId format invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Invalid order ID"
                details: "Order ID must be a non-empty alphanumeric string"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "Please provide a valid Authorization header"
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Order not found"
                details: "No order exists with ID 'order-456'"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Database query failed while retrieving order"

  /users/login:
    post:
      tags:
        - users
      summary: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          headers:
            X-Auth-Token:
              description: Authentication token
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example"
                expiresAt: "2026-04-06T20:00:00Z"
        '400':
          description: Bad request — missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Validation error"
                details: "Both 'username' and 'password' fields are required"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Invalid credentials"
                details: "The username or password you provided is incorrect"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Authentication service is temporarily unavailable"

  /users/{userId}:
    get:
      tags:
        - users
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "user-789"
                username: "johndoe"
                email: "john@example.com"
                firstName: "John"
                lastName: "Doe"
                status: "active"
        '400':
          description: Bad request — userId format invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 400
                message: "Invalid user ID"
                details: "User ID must be a non-empty alphanumeric string"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: "Unauthorized"
                details: "A valid Authorization header is required to access user data"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "User not found"
                details: "No user exists with ID 'user-789'"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 500
                message: "Internal server error"
                details: "Database query failed while retrieving user"

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          example: "pet-123"
        name:
          type: string
          example: "Fluffy"
        category:
          type: string
          example: "cat"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"
        tags:
          type: array
          items:
            type: string
          example: ["cute", "furry"]
        createdAt:
          type: string
          format: date-time

    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Fluffy"
        category:
          type: string
          example: "cat"
        status:
          type: string
          enum: [available, pending, sold]
          default: "available"
        tags:
          type: array
          items:
            type: string

    Order:
      type: object
      required:
        - id
        - petId
        - status
      properties:
        id:
          type: string
          example: "order-456"
        petId:
          type: string
          example: "pet-123"
        quantity:
          type: integer
          example: 1
        status:
          type: string
          enum: [placed, approved, delivered]
          example: "placed"
        shipDate:
          type: string
          format: date-time
        complete:
          type: boolean
          default: false

    NewOrder:
      type: object
      required:
        - petId
      properties:
        petId:
          type: string
        quantity:
          type: integer
          default: 1

    User:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          example: "user-789"
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        status:
          type: string
          enum: [active, inactive]
          example: "active"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Bad request"
        details:
          type: string
          example: "A required field is missing or has an invalid value"
